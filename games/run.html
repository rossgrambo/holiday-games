<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Escape! - Halloween Games</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/run-game.css">
</head>
<body>
    <div class="game-container">
        <!-- Difficulty Selection Screen -->
        <div id="difficulty-screen" class="screen">
            <div class="difficulty-content">
                <h1>🧟‍♂️ Zombie Escape!</h1>
                <p>Sprint through the haunted graveyard before the undead horde catches you!</p>
                
                <div class="difficulty-grid">
                    <button class="difficulty-btn" data-difficulty="toddler">
                        <span class="difficulty-icon">👻</span>
                        <span class="difficulty-name">Friendly Ghost</span>
                        <span class="difficulty-desc">Slow shamble</span>
                    </button>
                    
                    <button class="difficulty-btn" data-difficulty="child">
                        <span class="difficulty-icon">🎃</span>
                        <span class="difficulty-name">Jack-o'-Lantern</span>
                        <span class="difficulty-desc">Getting spooky</span>
                    </button>
                    
                    <button class="difficulty-btn" data-difficulty="adult">
                        <span class="difficulty-icon">🧟</span>
                        <span class="difficulty-name">Zombie Horde</span>
                        <span class="difficulty-desc">Real terror</span>
                    </button>
                    
                    <button class="difficulty-btn hidden" data-difficulty="crazy" id="crazy-btn">
                        <span class="difficulty-icon">💀</span>
                        <span class="difficulty-name">NIGHTMARE</span>
                        <span class="difficulty-desc">Pure horror!</span>
                    </button>
                </div>
                
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    ← Back to Gallery
                </button>
            </div>
        </div>
        
        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <canvas id="game-canvas"></canvas>
            
            <!-- Game UI -->
            <div class="game-ui">
                <div class="score-display">
                    <span>Distance: <span id="distance">0</span> ft</span>
                    <span>Speed: <span id="speed">0</span> ft/s</span>
                </div>
                
                <div class="zombie-warning" id="zombie-warning">
                    🧟 THE UNDEAD ARE COMING! 🧟
                </div>
            </div>
            
            <!-- Touch Controls -->
            <div class="touch-controls">
                <div class="touch-area left-control" id="left-control">
                    <div class="control-indicator">←</div>
                </div>
                <div class="touch-area right-control" id="right-control">
                    <div class="control-indicator">→</div>
                </div>
            </div>
            
            <!-- Pause Button -->
            <button class="pause-btn" id="pause-btn">⏸️</button>
        </div>
        
        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <div class="game-over-content">
                <h2 id="game-over-title">Game Over!</h2>
                <div id="game-over-message"></div>
                <div class="game-stats">
                    <p>Distance Traveled: <span id="final-distance">0</span> ft</p>
                    <p>Time Survived: <span id="final-time">0</span>s</p>
                    <p>Difficulty: <span id="final-difficulty">Normal</span></p>
                </div>
                
                <div class="game-over-buttons">
                    <button class="game-btn" id="restart-btn">Play Again</button>
                    <button class="game-btn secondary" id="difficulty-btn">Change Difficulty</button>
                    <button class="game-btn secondary" onclick="window.location.href='../index.html'">
                        Back to Gallery
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../main.js"></script>
    <script src="../scripts/run-game.js"></script>
    <script src="../scripts/falling-sprites.js"></script>
</body>
</html>
